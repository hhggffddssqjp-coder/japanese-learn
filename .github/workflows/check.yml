name: 檢查

# 每次 PR 或推送到 main 都自動檢查題庫格式與出題程式，避免擴充題庫時不小心弄壞
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['audio/**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: JS 語法檢查
        run: for f in js/*.js sw.js tools/*.mjs; do node --check "$f"; done
      - name: JSON 檢查（manifest、語音清單）
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
          if [ -f audio/manifest.json ]; then node -e "JSON.parse(require('fs').readFileSync('audio/manifest.json','utf8'))"; fi
      - name: 題庫資料檢查
        run: node tools/validate-data.mjs
      - name: 單字庫資料檢查（翻譯結果與輸入一致）
        run: node tools/build-bank.mjs n3 check
      - name: 預錄語音涵蓋檢查（只警告）
        run: node tools/check-audio.mjs
      - name: 出題冒煙測試
        run: node tools/smoke-test.mjs
