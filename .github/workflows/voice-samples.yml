name: 語音試聽樣本

# 手動執行：用同一組句子錄好幾種 Google 日語語音（Chirp 3 HD、Neural2…），
# 放進 audio-samples/ 並產生 voice-samples.html，打開 https://<你的網站>/voice-samples.html 就能比較聽感。
# 用量很小（約 3,000 字元），遠低於每月免費額度。
on:
  workflow_dispatch:
    inputs:
      voices:
        description: '指定要試聽的語音，用逗號分隔（留空＝自動挑選 Chirp 3 HD、Neural2 等）'
        type: string
        default: ''

permissions:
  contents: write
  pages: write

jobs:
  samples:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 產生試聽樣本
        run: node tools/gen-samples.mjs
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          VOICES: ${{ inputs.voices }}

      - name: 提交樣本
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio-samples voice-samples.html
          if git diff --cached --quiet; then
            echo "沒有變更"
          else
            git commit -m "Add voice samples"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: 觸發 GitHub Pages 重新部署
        continue-on-error: true
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
